name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-33 build-tools;36.0.0"

      - name: Build
        env:
          BUILD_TOOLS: "36.0.0"
        run: VARIANT=share sh build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: CleanLauncher-${{ github.sha }}
          path: build/CleanLauncher-compartir.apk
          if-no-files-found: error
